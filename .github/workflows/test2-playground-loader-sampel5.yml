name: Test 2 - Playground Loader Sampel 5

on:
  push:
    branches:
      - test-playground-loader-sampel5
    paths:
      - ".github/workflows/test2-playground-loader-sampel5.yml"
      - "scripts/test2_playground_loader_sampel5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-and-test:
    name: Load 5 DRAFT samples and run isolated Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: test-playground-loader-sampel5
          fetch-depth: 0
      - name: Verify source ancestry
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="80475e0f5e7c78c92a84109522777946dd9fb797"
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "EXPERIMENT_BRANCH=$(git branch --show-current)"
          echo "EXPERIMENT_HEAD=$(git rev-parse HEAD)"
          echo "PINNED_SOURCE_SHA=$SOURCE_SHA"
          if git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then echo "SOURCE_IS_ANCESTOR=yes"; else echo "SOURCE_IS_ANCESTOR=no"; exit 1; fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ILIS package
        run: python -m pip install -e .
      - name: Load exactly five sample bundles and evaluate
        run: python scripts/test2_playground_loader_sampel5.py
      - name: Upload loader proof and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test2-playground-sampel5-proof
          path: test-results/
          if-no-files-found: error
          retention-days: 30
