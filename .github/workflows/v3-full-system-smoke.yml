name: V3 Full System Smoke Test
# This workflow is intentionally isolated from the development branch.

on:
  push:
    branches:
      - ilis-v3-full-system-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated smoke-test branch
        uses: actions/checkout@v4
        with:
          ref: ilis-v3-full-system-smoke-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ILIS and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete V2.2 and V3 regression suite
        run: python -m pytest -q

      - name: Run explicit V3 full-system smoke scenarios
        run: python -m pytest -q tests/test_v3_full_system_smoke.py
